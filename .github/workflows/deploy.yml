name: Deploy frontend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crete-wildfire-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crete-wildfire-dashboard/package-lock.json
      - run: npm ci
      - run: npx ng build --base-href /crete-wildfire-risk/
      - run: cp dist/crete-wildfire-dashboard/browser/index.html dist/crete-wildfire-dashboard/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crete-wildfire-dashboard/dist/crete-wildfire-dashboard/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
